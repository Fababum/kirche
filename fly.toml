# fly.toml app configuration file generated for osterweg-wyland on 2026-08-07T08:22:52+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'osterweg-wyland'
primary_region = 'fra'

[build]
  # MapTiler-Key für die Standortkarte - per "Allowed HTTP Origins" beim
  # Anbieter auf unsere Domain(s) beschränkt, daher als Build-Arg (nicht als
  # Laufzeit-Secret) unbedenklich hier hinterlegt.
  [build.args]
    VITE_MAPTILER_KEY = 'pS9FckFHnk2270UG42Uc'
[env]
  DB_PATH = '/data/data.db'
  NODE_ENV = 'production'
  PORT = '4001'
  # Muss auf die echte(n) Domain(s) der Seite zeigen, damit CORS in
  # Produktion korrekt funktioniert. Mehrere Domains kommagetrennt möglich.
  CLIENT_ORIGIN = 'https://osterweg-wyland.com,https://www.osterweg-wyland.com,https://osterweg-wyland.fly.dev'
  PUBLIC_URL = 'https://osterweg-wyland.com'
  MAIL_FROM = 'Osterweg Wyland <noreply@osterweg-wyland.com>'

[[mounts]]
  source = 'osterweg_data'
  destination = '/data'

[http_service]
  internal_port = 4001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
